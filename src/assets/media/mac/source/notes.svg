<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <title>Ruled notepad</title>
  <defs>
    <linearGradient id="sheet" x2=".3" y2="1" gradientUnits="objectBoundingBox">
      <stop stop-color="#fffffe"/><stop offset=".44" stop-color="#fdfbf5"/><stop offset="1" stop-color="#eeece5"/>
    </linearGradient>
    <linearGradient id="binding" x2=".12" y2="1" gradientUnits="objectBoundingBox">
      <stop stop-color="#ffdb46"/><stop offset=".45" stop-color="#ffd33a"/><stop offset="1" stop-color="#f9c22f"/>
    </linearGradient>
    <linearGradient id="shade" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#706c59" stop-opacity=".2"/><stop offset="1" stop-color="#8b8669" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="outline" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#fff" stop-opacity=".6"/><stop offset=".48" stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="#9b9485" stop-opacity=".5"/>
    </linearGradient>
    <filter id="drop" x="-15%" y="-12%" width="130%" height="135%">
      <feGaussianBlur stdDeviation="1.7"/>
    </filter>
    <path id="shape" d="M35 7h58c16 0 27 9 27 27v58c0 19-10 29-28 29H35c-18 0-28-10-28-29V35C7 17 17 7 35 7Z"/>
    <clipPath id="clip"><use href="#shape"/></clipPath>
  </defs>
  <use href="#shape" transform="translate(0 2)" fill="#24231c" opacity=".25" filter="url(#drop)"/>
  <g clip-path="url(#clip)">
    <use href="#shape" fill="url(#sheet)"/>
    <path d="M5 0h118v45H5z" fill="url(#binding)"/>
    <path d="M5 44h118v1H5z" fill="#c69a2d" opacity=".5"/>
    <path d="M5 45h118v4H5z" fill="url(#shade)"/>
    <path d="M5 37.4h118" fill="none" stroke="#c79c2b" stroke-opacity=".67" stroke-width="1.3" stroke-dasharray="1.3 1.7"/>
    <path d="M5 38.4h118" fill="none" stroke="#fff2af" stroke-opacity=".75" stroke-width="1" stroke-dasharray="1.3 1.7"/>
    <path d="M5 64h118M5 82h118M5 100h118M5 118h118" fill="none" stroke="#d9d8ce" stroke-width="1.4"/>
    <path d="M5 65.2h118M5 83.2h118M5 101.2h118M5 119.2h118" fill="none" stroke="#fff" stroke-opacity=".85" stroke-width=".9"/>
  </g>
  <use href="#shape" fill="none" stroke="url(#outline)" stroke-width="1"/>
</svg>
